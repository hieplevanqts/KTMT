# GitLab CI config for deploying static HTML site to GitLab Pages
# ========================================================

pages:
  stage: deploy
  script:
    # Tạo thư mục public (nếu chưa có)
    - mkdir public
    # Copy toàn bộ file, trừ thư mục .git, .gitlab-ci.yml và chính public/
    - rsync -av --exclude=public --exclude=.git --exclude=.gitlab-ci.yml ./ public
  artifacts:
    paths:
      - public
  only:
    - main   # hoặc master, tùy nhánh chính của bạn
