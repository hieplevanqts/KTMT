# GitLab CI config for deploying static HTML site to GitLab Pages
# ========================================================

pages:
  stage: deploy
  image: ruby:3.1   # hoặc alpine:latest cũng được
  script:
    # Bật pattern mở rộng trong bash
    - shopt -s extglob
    # Tạo thư mục public (chứa file để deploy)
    - mkdir public
    # Copy tất cả mọi thứ trừ thư mục public và file config CI
    - cp -r !(public|.git|.gitlab-ci.yml) public/
  artifacts:
    paths:
      - public
  only:
    - main   # chỉ chạy khi push lên nhánh main
