# GitLab CI config for deploying static HTML site to GitLab Pages
# ========================================================

pages:
  stage: deploy
  script:
    # Tạo thư mục public (GitLab Pages yêu cầu)
    - mkdir public
    # Copy toàn bộ source code vào public/
    - cp -r * public
    # Xóa .gitlab-ci.yml khỏi thư mục public (nếu không muốn public file này)
    - rm -f public/.gitlab-ci.yml
  artifacts:
    paths:
      - public
  only:
    - main   # hoặc master, tùy nhánh chính bạn dùng
