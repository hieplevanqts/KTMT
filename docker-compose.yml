version: '3.8'

services:
  web:
    build: .
    container_name: python-web
    expose:
      - "5001"
    volumes:
      - .:/app

  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "86:86"
      - "4430:4430"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web